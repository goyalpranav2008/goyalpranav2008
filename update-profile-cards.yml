name: Update Profile Cards

on:
  schedule:
    - cron: "0 4 * * *"   # once a day
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&theme=dark&hide_border=true&bg_color=0d1117&title_color=00e5ff&icon_color=00e5ff&text_color=8b949e"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&theme=dark&hide_border=true&bg_color=0d1117&title_color=00e5ff&text_color=8b949e"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=${{ github.repository_owner }}&theme=dark&hide_border=true&background=0d1117&stroke=0d1117&ring=00e5ff&fire=00e5ff&currStreakLabel=00e5ff&sideLabels=8b949e&currStreakNum=ffffff&sideNums=ffffff&dates=8b949e"
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Trophy self-host action currently lives on an unmerged feature branch
      # upstream. If this step ever fails, delete it and swap the trophy
      # <img> in the README back to the public github-profile-trophy.vercel.app
      # URL — it's the least critical card.
      - name: Generate trophy card
        continue-on-error: true
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          output_path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet || git commit -m "chore: refresh profile cards"
          git push
